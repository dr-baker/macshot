name: Build, Sign & Release

# Triggers on tag push or manual dispatch
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.8.0-beta.2)'
        required: true
      resume_run:
        description: 'Run ID whose notarized images to publish (skips building; see the Notarize step)'
        required: false
        default: ''

permissions:
  contents: write   # create releases
  actions: read     # restore images from an earlier run when resuming

jobs:
  release:
    runs-on: macos-26        # Xcode 26 + macOS 26 SDK (needed for NSGlassEffectView / Liquid Glass)
    timeout-minutes: 360
    env:
      NORMAL_FEED_URL: https://raw.githubusercontent.com/dr-baker/macshot/main/appcast.xml
      OFFLINE_FEED_URL: https://raw.githubusercontent.com/dr-baker/macshot/main/appcast-offline.xml

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require fork release configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 << 'PYEOF'
          import base64
          import binascii
          import os

          if os.environ["GITHUB_REPOSITORY"] != "dr-baker/macshot":
              raise SystemExit("This workflow publishes Macshot Pro releases from dr-baker/macshot")
          for name in ("SPARKLE_PUBLIC_KEY", "SPARKLE_PRIVATE_KEY"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Configure the fork's {name} repository secret before releasing")
          try:
              public_key = base64.b64decode(os.environ["SPARKLE_PUBLIC_KEY"], validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("SPARKLE_PUBLIC_KEY must be a base64-encoded Ed25519 public key")
          if len(public_key) != 32:
              raise SystemExit("SPARKLE_PUBLIC_KEY must decode to a 32-byte Ed25519 public key")
          try:
              private_key = base64.b64decode(os.environ["SPARKLE_PRIVATE_KEY"].strip(), validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("SPARKLE_PRIVATE_KEY must be a base64-encoded Sparkle signing key")
          if len(private_key) not in (32, 96):
              raise SystemExit("SPARKLE_PRIVATE_KEY must decode to a 32-byte seed or a 96-byte legacy key")
          PYEOF

      # ── 1b. Select Xcode 26 (macOS 26 SDK) ─────────────────────────────────
      - name: Select Xcode
        run: |
          # Pick the highest installed Xcode 26.x so the macOS 26 SDK
          # (NSGlassEffectView) is available.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      # ── 2. Parse version from tag ──────────────────────────────────────────
      - name: Set version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Use manual input tag if workflow_dispatch, otherwise use the pushed tag
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Expected a release tag such as v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi
          VERSION="${TAG#v}"   # strip leading 'v'
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          if [[ "$VERSION" == *"-beta"* ]]; then
            echo "IS_BETA=true" >> $GITHUB_ENV
          else
            echo "IS_BETA=false" >> $GITHUB_ENV
          fi

      # ── 3. Import Developer ID certificate into a temporary keychain ───────
      - name: Import signing certificate
        if: ${{ !inputs.resume_run }}
        env:
          CERT_P12_BASE64:  ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD:    ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"     >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS"     >> $GITHUB_ENV

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | sed -E 's/.*"(.+)"/\1/' | head -1)
          echo "SIGNING_IDENTITY=$IDENTITY"       >> $GITHUB_ENV

          rm /tmp/cert.p12

      # ── 4. Resolve SPM packages + Build ───────────────────────────────────
      - name: Build normal and offline apps
        if: ${{ !inputs.resume_run }}
        run: |
          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resolvePackageDependencies

          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build-offline \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) OFFLINE' \
            MACSHOT_BUNDLE_IDENTIFIER="com.drbaker.macshot.pro.offline" \
            MACSHOT_PRODUCT_NAME="Macshot Pro Offline" \
            INFOPLIST_KEY_CFBundleDisplayName="Macshot Pro Offline" \
            INFOPLIST_KEY_CFBundleName="Macshot Pro Offline" \
            MACSHOT_UPDATE_FEED_URL="$OFFLINE_FEED_URL" \
            build

      - name: Configure release updater metadata
        if: ${{ !inputs.resume_run }}
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          python3 << 'PYEOF'
          import os
          import plistlib
          from pathlib import Path

          public_key = os.environ["SPARKLE_PUBLIC_KEY"]
          variants = (
              ("build", "Macshot Pro", "com.drbaker.macshot.pro", os.environ["NORMAL_FEED_URL"]),
              ("build-offline", "Macshot Pro Offline", "com.drbaker.macshot.pro.offline", os.environ["OFFLINE_FEED_URL"]),
          )
          for build_directory, product_name, bundle_id, feed_url in variants:
              plist_path = Path(build_directory) / "Build/Products/Release" / f"{product_name}.app/Contents/Info.plist"
              plist = plistlib.loads(plist_path.read_bytes())
              expected = {
                  "CFBundleIdentifier": bundle_id,
                  "CFBundleDisplayName": product_name,
                  "CFBundleName": product_name,
                  "LSMinimumSystemVersion": "13.0",
              }
              for key, value in expected.items():
                  if plist.get(key) != value:
                      raise SystemExit(f"{product_name}: expected {key}={value}, got {plist.get(key)!r}")
              plist["SUPublicEDKey"] = public_key
              plist["SUFeedURL"] = feed_url
              plist["SUEnableAutomaticChecks"] = True
              if bundle_id.endswith(".offline"):
                  plist["CFBundleURLTypes"] = [
                      item for item in plist.get("CFBundleURLTypes", [])
                      if item.get("CFBundleURLName") != "Google OAuth"
                  ]
              plist_path.write_bytes(plistlib.dumps(plist))
          # A resumed run must use the same key as the signed app bundles.
          Path("sparkle-public-key.txt").write_text(public_key + "\n")
          PYEOF

      # ── 5. Sign the .apps with Developer ID ───────────────────────────────
      - name: Sign apps
        if: ${{ !inputs.resume_run }}
        run: |
          python3 << 'PYEOF'
          import plistlib
          from pathlib import Path

          entitlements = plistlib.loads(Path("macshot/macshot.entitlements").read_bytes())
          lookup_key = "com.apple.security.temporary-exception.mach-lookup.global-name"
          names = entitlements[lookup_key]
          normal_prefix = "com.drbaker.macshot.pro"
          offline_prefix = "com.drbaker.macshot.pro.offline"
          services = {f"{normal_prefix}-spks", f"{normal_prefix}-spki"}
          if not services.issubset(names) or "com.apple.axserver" not in names:
              raise SystemExit("Normal entitlements must contain Sparkle services and Accessibility lookup")
          entitlements[lookup_key] = [
              name.replace(normal_prefix, offline_prefix, 1) if name in services else name
              for name in names
          ]
          Path("/tmp/macshot-offline.entitlements").write_bytes(plistlib.dumps(entitlements))
          PYEOF

          sign_app() {
            local APP="$1"
            local ENTITLEMENTS="$2"

            # Sparkle's XPC services (Installer.xpc, Downloader.xpc) must NOT be sandboxed.
            # They ship with empty entitlements so they can write to /Applications to replace
            # the app bundle during updates. We must sign them WITHOUT the app's sandbox
            # entitlements, and we must not use --deep on the outer app (which would re-sign
            # them with the parent's entitlements).
            #
            # Signing order: innermost → outermost.

            find "$APP/Contents" -name "*.xpc" -print0 | while IFS= read -r -d '' xpc; do
              echo "Signing XPC: $xpc"
              codesign --force --options runtime \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" "$xpc"
            done

            find "$APP/Contents" -name "*.app" -print0 | while IFS= read -r -d '' helper; do
              echo "Signing helper: $helper"
              codesign --force --options runtime \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" "$helper"
            done

            local AUTOUPDATE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
            if [ -f "$AUTOUPDATE" ]; then
              echo "Signing Autoupdate"
              codesign --force --options runtime \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" "$AUTOUPDATE"
            fi

            find "$APP/Contents" -name "*.dylib" -print0 | while IFS= read -r -d '' f; do
              echo "Signing dylib: $f"
              codesign --force --options runtime \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" "$f"
            done

            find "$APP/Contents" -name "*.framework" -print0 | while IFS= read -r -d '' f; do
              echo "Signing framework: $f"
              codesign --force --options runtime \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$KEYCHAIN_PATH" "$f"
            done

            echo "Signing main app: $APP"
            codesign --force --options runtime \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements "$ENTITLEMENTS" \
              "$APP"

            codesign --verify --deep --strict "$APP"
            echo "✅ Signing verified: $APP"

            while IFS= read -r -d '' xpc; do
              ENT=$(codesign -d --entitlements - "$xpc" 2>&1 || true)
              if echo "$ENT" | grep -q "app-sandbox"; then
                echo "❌ ERROR: $xpc has sandbox entitlements — updates will fail!"
                exit 1
              fi
              echo "✅ $(basename "$xpc"): no sandbox (correct)"
            done < <(find "$APP/Contents" -name "*.xpc" -print0)
          }

          sign_app "build/Build/Products/Release/Macshot Pro.app" "macshot/macshot.entitlements"
          sign_app "build-offline/Build/Products/Release/Macshot Pro Offline.app" "/tmp/macshot-offline.entitlements"

      # ── 6. Package into DMGs ───────────────────────────────────────────────
      - name: Package DMGs
        if: ${{ !inputs.resume_run }}
        run: |
          brew install create-dmg

          package_dmg() {
            local APP="$1"
            local DMG="$2"
            local VOLNAME="$3"
            local STAGING="$4"
            local APP_NAME
            APP_NAME="$(basename "$APP")"

            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            cp -R "$APP" "$STAGING/"

            # create-dmg returns exit code 2 if it can't set the volume icon
            # (no .icns at the root), which is fine — the app icon shows up anyway.
            create-dmg \
              --volname "$VOLNAME" \
              --background "assets/dmg-background.png" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "$APP_NAME" 150 185 \
              --app-drop-link 450 185 \
              --no-internet-enable \
              --hide-extension "$APP_NAME" \
              "$DMG" \
              "$STAGING" \
              || [ $? -eq 2 ]
          }

          package_dmg "build/Build/Products/Release/Macshot Pro.app" "Macshot-Pro.dmg" "Macshot Pro" "/tmp/dmg-staging-normal"
          package_dmg "build-offline/Build/Products/Release/Macshot Pro Offline.app" "Macshot-Pro-Offline.dmg" "Macshot Pro Offline" "/tmp/dmg-staging-offline"

      # ── 7. Notarize ────────────────────────────────────────────────────────
      # A new developer team's first submissions can take hours at Apple. The
      # signed images and their submission IDs are kept as an artifact, so a
      # run that stops waiting can be resumed later without rebuilding and
      # resubmitting (which only adds to Apple's queue).
      - name: Submit for notarization
        if: ${{ !inputs.resume_run }}
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID:     ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID:  ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID")
          submit() {
            xcrun notarytool submit "$1" "${AUTH[@]}" --output-format json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
          }
          echo "MAIN=$(submit Macshot-Pro.dmg)" > notarization-ids.txt
          echo "OFFLINE=$(submit Macshot-Pro-Offline.dmg)" >> notarization-ids.txt
          echo "$BUILD_NUMBER" > build-number.txt
          cat notarization-ids.txt

      - name: Keep images for resuming
        if: ${{ !inputs.resume_run }}
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ env.VERSION }}
          path: |
            Macshot-Pro.dmg
            Macshot-Pro-Offline.dmg
            notarization-ids.txt
            build-number.txt
            sparkle-public-key.txt
          retention-days: 14

      - name: Restore images from the earlier run
        if: ${{ inputs.resume_run }}
        uses: actions/download-artifact@v4
        with:
          name: notarization-${{ env.VERSION }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify restored signing metadata and build number
        if: ${{ inputs.resume_run }}
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          python3 << 'PYEOF'
          import os
          from pathlib import Path

          if Path("sparkle-public-key.txt").read_text().strip() != os.environ["SPARKLE_PUBLIC_KEY"]:
              raise SystemExit("The restored apps use a different Sparkle key; resume with that key or rebuild")
          if not Path("build-number.txt").read_text().strip().isdigit():
              raise SystemExit("The restored app build number is invalid")
          PYEOF
          # The appcast must carry the build number baked into these images.
          echo "BUILD_NUMBER=$(cat build-number.txt)" >> $GITHUB_ENV
          cat notarization-ids.txt

      - name: Notarize
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID:     ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID:  ${{ secrets.ASC_API_ISSUER_ID }}
          SOURCE_RUN:         ${{ inputs.resume_run || github.run_id }}
          TAG:                ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID")
          . ./notarization-ids.txt

          # Wait for both submissions together.
          xcrun notarytool wait "$MAIN" "${AUTH[@]}" --timeout 120m & PID_MAIN=$!
          xcrun notarytool wait "$OFFLINE" "${AUTH[@]}" --timeout 120m & PID_OFFLINE=$!
          wait "$PID_MAIN" || true
          wait "$PID_OFFLINE" || true

          pending=0
          for pair in "Macshot-Pro.dmg:$MAIN" "Macshot-Pro-Offline.dmg:$OFFLINE"; do
            dmg=${pair%%:*}; id=${pair#*:}
            # Retry: a brief network drop on the runner must not fail the run.
            status=""
            for try in 1 2 3 4 5 6; do
              status=$(xcrun notarytool info "$id" "${AUTH[@]}" --output-format json 2>/dev/null \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' 2>/dev/null) && break
              echo "Could not read the status of $dmg (attempt $try), retrying in 30 s"
              sleep 30
            done
            [ -n "$status" ] || status="In Progress"
            echo "$dmg ($id): $status"
            case "$status" in
              Accepted) ;;
              "In Progress") pending=1 ;;
              *) xcrun notarytool log "$id" "${AUTH[@]}" || true; exit 1 ;;
            esac
          done
          if [ "$pending" = 1 ]; then
            echo "::error::Apple is still processing. Nothing was published. Once 'xcrun notarytool history' shows both as Accepted, resume without rebuilding:"
            echo "gh workflow run build-release.yml --ref main -f tag=$TAG -f resume_run=$SOURCE_RUN"
            exit 1
          fi

          for dmg in Macshot-Pro.dmg Macshot-Pro-Offline.dmg; do
            # Apple's ticket service sometimes throttles right after acceptance
            # (stapler error 68 with a retry-after); the ticket still exists.
            for attempt in 1 2 3 4 5 6 7 8; do
              if xcrun stapler staple "$dmg"; then break; fi
              if [ "$attempt" = 8 ]; then echo "Stapling $dmg failed"; exit 1; fi
              echo "Staple attempt $attempt failed, retrying in 3 minutes"
              sleep 180
            done
          done

          echo "✅ Notarization complete"
          rm -f "$KEY"

      # ── 8. Extract changelog entry for this version ───────────────────────
      - name: Extract release notes
        run: |
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          cat release_notes.md

      # ── 9. Sign DMG for Sparkle and update appcast ───────────────────────
      - name: Write appcast helper scripts
        run: |
          python3 << 'PYEOF'
          import textwrap, pathlib
          pathlib.Path("/tmp/extract_stable.py").write_text(textwrap.dedent("""\
              import pathlib, sys, xml.etree.ElementTree as ET
              ET.register_namespace('sparkle', 'http://www.andymatuschak.org/xml-namespaces/sparkle')
              ns = {'sparkle': 'http://www.andymatuschak.org/xml-namespaces/sparkle'}
              source, output = sys.argv[1:3]
              stable = []
              if pathlib.Path(source).exists():
                  tree = ET.parse(source)
                  for item in tree.findall('.//item'):
                      if item.find('sparkle:channel', ns) is None:
                          stable.append(ET.tostring(item, encoding='unicode'))
              with open(output, 'w') as f:
                  f.write('\\n'.join(stable))
          """))
          pathlib.Path("/tmp/build_item.py").write_text(textwrap.dedent("""\
              import sys
              output = sys.argv[1]
              version, build_number, date, channel, html, url, size, sig = sys.argv[2:10]
              channel_line = f'    <sparkle:channel>{channel}</sparkle:channel>' if channel else ''
              with open(output, 'w') as f:
                  f.write(f'''<item>
                  <title>v{version}</title>
                  <pubDate>{date}</pubDate>
                  <sparkle:version>{build_number}</sparkle:version>
                  <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
                  <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
              {channel_line}
                  <description><![CDATA[
                    <style>
                      body {{ font-family: -apple-system, sans-serif; font-size: 13px; padding: 12px; }}
                      h3 {{ font-size: 14px; margin: 12px 0 6px 0; }}
                      h3:first-child {{ margin-top: 0; }}
                      ul {{ padding-left: 18px; margin: 4px 0; }}
                      li {{ margin: 4px 0; line-height: 1.5; }}
                    </style>
                    {html}
                  ]]></description>
                  <enclosure
                      url="{url}"
                      length="{size}"
                      type="application/octet-stream"
                      sparkle:edSignature="{sig}"
                  />
              </item>''')
          """))
          pathlib.Path("/tmp/assemble_appcast.py").write_text(textwrap.dedent("""\
              import sys, os
              is_beta = sys.argv[1] == 'true'
              stable_path, new_item_path, output_path, title, description = sys.argv[2:7]
              stable = ''
              if is_beta and os.path.exists(stable_path):
                  stable = open(stable_path).read().strip()
              new_item = open(new_item_path).read().strip()
              parts = [p for p in [stable, new_item] if p]
              items = '\\n'.join(parts)
              with open(output_path, 'w') as f:
                  f.write(f'''<?xml version="1.0" encoding="utf-8"?>
              <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
                  <channel>
                      <title>{title}</title>
                      <link>https://github.com/{os.environ["GITHUB_REPOSITORY"]}</link>
                      <description>{description}</description>
              {items}
                  </channel>
              </rss>
              ''')
          """))
          PYEOF

          cat > /tmp/verify_sparkle_update.swift << 'SWIFTEOF'
          import CryptoKit
          import Darwin
          import Foundation

          func fail(_ message: String) -> Never {
              fputs(message + "\n", stderr)
              exit(1)
          }

          let arguments = CommandLine.arguments
          guard arguments.count == 4,
                let signature = Data(base64Encoded: arguments[2]), signature.count == 64,
                let publicKeyData = Data(base64Encoded: arguments[3]), publicKeyData.count == 32 else {
              fail("Expected an archive, a 64-byte Ed25519 signature, and a 32-byte public key")
          }
          // CryptoKit's Curve25519.Signing uses the same Ed25519 signatures as Sparkle.
          let publicKey = try Curve25519.Signing.PublicKey(rawRepresentation: publicKeyData)
          let archive = try Data(contentsOf: URL(fileURLWithPath: arguments[1]), options: .mappedIfSafe)
          guard publicKey.isValidSignature(signature, for: archive) else {
              fail("Sparkle DMG signature does not match the configured SPARKLE_PUBLIC_KEY")
          }
          SWIFTEOF
          xcrun swiftc -O /tmp/verify_sparkle_update.swift -o /tmp/verify_sparkle_update

      - name: Update Sparkle appcasts
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Download Sparkle tools
          SPARKLE_VERSION="2.9.0"
          curl -L -o /tmp/Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle
          tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle

          umask 077
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          trap 'rm -f /tmp/sparkle_key' EXIT
          DATE=$(date -R)

          if [ "$IS_BETA" = "true" ]; then
            git fetch origin main:refs/remotes/origin/main
            git show origin/main:appcast.xml > appcast.xml 2>/dev/null || true
            git show origin/main:appcast-offline.xml > appcast-offline.xml 2>/dev/null || true
          fi

          # Convert release notes markdown to HTML for Sparkle update dialog
          RELEASE_HTML=""
          if [ -s release_notes.md ]; then
            RELEASE_HTML=$(sed -E \
              -e 's/^### (.+)/<\/ul><h3>\1<\/h3><ul>/' \
              -e 's/^- \*\*([^*]+)\*\* [-–] (.+)/<li><b>\1<\/b> — \2<\/li>/' \
              -e 's/^- \*\*([^*]+)\*\*(.*)/<li><b>\1<\/b>\2<\/li>/' \
              -e 's/^- (.+)/<li>\1<\/li>/' \
              release_notes.md | tr '\n' ' ')
            # Clean up: remove leading </ul>, add trailing </ul>
            RELEASE_HTML=$(echo "$RELEASE_HTML" | sed -E \
              -e 's|^ *</ul> *||' \
              -e 's| *$|</ul>|')
          fi

          # Build the new <item> block
          CHANNEL=""
          if [ "$IS_BETA" = "true" ]; then
            CHANNEL="beta"
          fi

          update_appcast() {
            local VARIANT="$1"
            local DMG="$2"
            local APPCAST="$3"
            local TITLE="$4"
            local DESCRIPTION="$5"
            local ITEM_PATH="/tmp/new_item_${VARIANT}.xml"
            local STABLE_PATH="/tmp/stable_items_${VARIANT}.xml"

            ED_SIG=$(/tmp/sparkle/bin/sign_update -p "$DMG" --ed-key-file /tmp/sparkle_key)
            /tmp/verify_sparkle_update "$DMG" "$ED_SIG" "$SPARKLE_PUBLIC_KEY"
            FILESIZE=$(stat -f%z "$DMG")
            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DMG}"

            python3 /tmp/build_item.py "$ITEM_PATH" "$VERSION" "$BUILD_NUMBER" "$DATE" "$CHANNEL" "$RELEASE_HTML" "$DOWNLOAD_URL" "$FILESIZE" "$ED_SIG"

            if [ "$IS_BETA" = "true" ] && [ -f "$APPCAST" ]; then
              python3 /tmp/extract_stable.py "$APPCAST" "$STABLE_PATH" 2>/dev/null || echo "" > "$STABLE_PATH"
            else
              echo "" > "$STABLE_PATH"
            fi

            python3 /tmp/assemble_appcast.py "$IS_BETA" "$STABLE_PATH" "$ITEM_PATH" "$APPCAST" "$TITLE" "$DESCRIPTION"

            python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$APPCAST" || {
              echo "❌ ERROR: $APPCAST is not valid XML — aborting to protect user updates"
              exit 1
            }
            echo "✅ $APPCAST generated and validated"
            cat "$APPCAST"
          }

          update_appcast "normal" "Macshot-Pro.dmg" "appcast.xml" "Macshot Pro" "Macshot Pro updates"
          update_appcast "offline" "Macshot-Pro-Offline.dmg" "appcast-offline.xml" "Macshot Pro Offline" "Macshot Pro Offline updates"
          rm -f /tmp/sparkle_key

      # ── 10. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_BETA" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Macshot-Pro.dmg Macshot-Pro-Offline.dmg --clobber
            gh release edit "v$VERSION" \
              --title "v$VERSION" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          else
            gh release create "v$VERSION" Macshot-Pro.dmg Macshot-Pro-Offline.dmg \
              --title "v$VERSION" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi

      # ── 11. Commit appcasts to main ────────────────────────────────────────
      - name: Commit appcasts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save the generated appcasts before switching branches
          cp appcast.xml /tmp/appcast.xml
          cp appcast-offline.xml /tmp/appcast-offline.xml
          git fetch origin main:refs/remotes/origin/main
          # Force the switch: the generated appcasts are already saved above, and
          # a plain checkout aborts with "local changes would be overwritten" when
          # the appcasts differ between the built ref and main (e.g. the tag was
          # cut before the previous release's appcast commit landed on main).
          git checkout -f -B main origin/main
          cp /tmp/appcast.xml appcast.xml
          cp /tmp/appcast-offline.xml appcast-offline.xml
          git add appcast.xml appcast-offline.xml
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "ci: update appcasts for v${VERSION}"
            git push origin main
          }

      # ── 12. Cleanup keychain ────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
